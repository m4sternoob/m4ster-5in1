name: Build macOS app (Swift)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          APP="5IN1.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/GuessingGame "$APP/Contents/MacOS/GuessingGame"
          cp packaging/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/GuessingGame"

      - name: Generate app icon
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 packaging/generate_icon.py

      - name: Build .icns from icon
        run: |
          set -euo pipefail
          ICONSET="AppIcon.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -z 16 16     packaging/AppIcon-1024.png --out "$ICONSET/icon_16x16.png" > /dev/null
          sips -z 32 32     packaging/AppIcon-1024.png --out "$ICONSET/icon_16x16@2x.png" > /dev/null
          sips -z 32 32     packaging/AppIcon-1024.png --out "$ICONSET/icon_32x32.png" > /dev/null
          sips -z 64 64     packaging/AppIcon-1024.png --out "$ICONSET/icon_32x32@2x.png" > /dev/null
          sips -z 128 128   packaging/AppIcon-1024.png --out "$ICONSET/icon_128x128.png" > /dev/null
          sips -z 256 256   packaging/AppIcon-1024.png --out "$ICONSET/icon_128x128@2x.png" > /dev/null
          sips -z 256 256   packaging/AppIcon-1024.png --out "$ICONSET/icon_256x256.png" > /dev/null
          sips -z 512 512   packaging/AppIcon-1024.png --out "$ICONSET/icon_256x256@2x.png" > /dev/null
          sips -z 512 512   packaging/AppIcon-1024.png --out "$ICONSET/icon_512x512.png" > /dev/null
          sips -z 1024 1024 packaging/AppIcon-1024.png --out "$ICONSET/icon_512x512@2x.png" > /dev/null
          iconutil -c icns "$ICONSET" -o "5IN1.app/Contents/Resources/AppIcon.icns"

      - name: Ad-hoc sign (after ALL binary changes)
        run: |
          set -euo pipefail
          BIN="5IN1.app/Contents/MacOS/GuessingGame"
          APP="5IN1.app"
          # True only if the bundle actually carries a signature right now.
          # (Build #13 proved codesign can exit 0 while writing nothing, so
          # never trust the exit code alone.)
          has_sig() { codesign -dv "$APP" >/dev/null 2>&1; }
          # Clean slate: strip the ad-hoc signature Swift's linker leaves.
          codesign --remove-signature "$BIN" || true
          SIGNED=""

          echo "--- recipe A: bundle seal, explicit identifier ---"
          if codesign --sign - --identifier com.guessinggame.gui "$APP" 2>sign.log && has_sig; then
            SIGNED="A"
          else
            echo "A failed:"; cat sign.log || true
            echo "--- recipe B: bundle, --force, no identifier ---"
            if codesign --force --sign - "$APP" 2>sign.log && has_sig; then
              SIGNED="B"
            else
              echo "B failed:"; cat sign.log || true
              echo "--- recipe C: --force --deep (build #3's GameHub recipe) ---"
              if codesign --force --deep --sign - "$APP" 2>sign.log && has_sig; then
                SIGNED="C"
              else
                echo "C failed:"; cat sign.log || true
                echo "--- recipe D: inner binary first, then bundle ---"
                codesign --force --sign - "$BIN" >/dev/null 2>&1 || true
                if codesign --force --sign - "$APP" 2>sign.log && has_sig; then
                  SIGNED="D"
                else
                  echo "D failed:"; cat sign.log || true
                fi
              fi
            fi
          fi

          if [ -n "$SIGNED" ]; then
            echo "SIGN-OK: recipe $SIGNED (signature verified present)"
          else
            echo "ALL RECIPES FAILED — shipping UNSIGNED (right-click the app and choose Open to launch)"
            codesign --remove-signature "$BIN" || true
            touch SIGNING_FAILED_UNSIGNED
          fi
          codesign -dv "$APP" 2>&1 | head -5 || true
          spctl --assess --type execute "$APP" || true

      - name: Verify bundle
        run: |
          set -euo pipefail
          echo "--- linked libraries (must be system-only) ---"
          otool -L "5IN1.app/Contents/MacOS/GuessingGame"
          if otool -L "5IN1.app/Contents/MacOS/GuessingGame" | grep -iE "homebrew|/opt/|@executable_path.*\.dylib"; then
            echo "ERROR: non-system dylib linkage found"; exit 1
          fi
          echo "--- signature (may be unsigned; see sign step) ---"
          codesign -dv "5IN1.app" 2>&1 | head -8 || true
          /usr/bin/plutil -p "5IN1.app/Contents/Info.plist" | grep -E "CFBundleExecutable|CFBundleShortVersionString"

      - name: Package zip
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "5IN1.app" "5IN1-macOS-v3.2.1.zip"
          shasum -a 256 "5IN1-macOS-v3.2.1.zip" | tee sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5IN1-macOS-v3.2.1
          path: |
            5IN1-macOS-v3.2.1.zip
            sha256.txt
